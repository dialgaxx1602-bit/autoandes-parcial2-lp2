server:
  port: 8080

spring:
  application:
    name: autoandes-backend
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: AUTOANDES
    password: 1234567
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    # 256-bit base64 encoded secret
    secret: dGhpc0lzQVZlcnlTZWN1cmVTZWNyZXRLZXlGb3JBdXRvQW5kZXNQcm9qZWN0MjAyNiE=
    expiration-seconds: 3600

logging:
  level:
    root: INFO
    pe.edu.upeu.autoandes: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
